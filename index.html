</head><body><title>Antrenman Planlayıcı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="three.min.js"></script>
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --ink:#16202A; --muted:#5B6874; --line:#D6DCE1; --ghost:#A7B1BA; --soft:#F4F6F8;
  --mus:#C3CBD2; --bodyn:#E2E7EB; --fig3d:#8C97A1; --plate:#2A323A; --metal:#8C969E; --floor:#DFE5EA;
  --brand:#D2302C; --ok:#2B9551; --warn:#E2B01A;
  --c-chest:#DC3F35; --c-back:#2F6FD6; --c-shoulders:#E0831A; --c-biceps:#8A44C9; --c-triceps:#C23B84; --c-forearms:#8A7258;
  --c-abs:#D1A80F; --c-legs:#2E9A55; --c-glutes:#12A0A0; --c-calves:#728A18; --c-cardio:#56657A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151B; --surface:#172029; --ink:#E7ECF0; --muted:#95A2AE; --line:#29343F; --ghost:#4D5A67; --soft:#1C2631;
    --mus:#35424E; --bodyn:#222C36; --fig3d:#77838F; --plate:#0C1014; --metal:#6F7A84; --floor:#26313C;
    --brand:#EF4B45; --ok:#3FB56A; --warn:#F2C53A;
    --c-chest:#F0574C; --c-back:#4C86EA; --c-shoulders:#F29A36; --c-biceps:#A566E0; --c-triceps:#E0569F; --c-forearms:#A88E72;
    --c-abs:#EBC232; --c-legs:#3FB56A; --c-glutes:#2CC0BE; --c-calves:#98B432; --c-cardio:#7C8BA0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151B; --surface:#172029; --ink:#E7ECF0; --muted:#95A2AE; --line:#29343F; --ghost:#4D5A67; --soft:#1C2631;
  --mus:#35424E; --bodyn:#222C36; --fig3d:#77838F; --plate:#0C1014; --metal:#6F7A84; --floor:#26313C;
  --brand:#EF4B45; --ok:#3FB56A; --warn:#F2C53A;
  --c-chest:#F0574C; --c-back:#4C86EA; --c-shoulders:#F29A36; --c-biceps:#A566E0; --c-triceps:#E0569F; --c-forearms:#A88E72;
  --c-abs:#EBC232; --c-legs:#3FB56A; --c-glutes:#2CC0BE; --c-calves:#98B432; --c-cardio:#7C8BA0;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,8.5vw,48px);line-height:.95;letter-spacing:.01em;text-transform:uppercase;margin:0;text-wrap:balance}
header h1 span{color:var(--brand)}
.sub{color:var(--muted);margin:.4rem 0 0;font-size:14px;max-width:60ch}
.lang{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.lang button{appearance:none;border:none;background:var(--surface);color:var(--muted);font:700 13px var(--mono);padding:7px 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
h2.sec{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:22px;letter-spacing:.03em;margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.panel .hd{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin:4px 0 0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding-block:10px;margin-top:6px}
.wd{appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 2px 6px;text-align:center;font:500 11px var(--body);color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-width:0}
.wd b{font-family:var(--display);font-size:16px;color:var(--ink);letter-spacing:.03em;text-transform:uppercase}
.wd .dots{display:flex;gap:2px;height:8px;flex-wrap:wrap;justify-content:center;max-width:100%}
.wd .dots i{width:7px;height:7px;border-radius:50%}
.wd .n{font-family:var(--mono);font-size:10.5px}
.wd.sel{background:var(--ink);border-color:var(--ink)}
.wd.sel b,.wd.sel .n{color:var(--surface)}
.wd.today:not(.sel){outline:2px solid var(--ink);outline-offset:-2px}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:6px 0 10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-weight:800;text-transform:uppercase;font-size:32px;margin:0;line-height:1;letter-spacing:.02em}
.dayhead p{margin:4px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:9px;padding:6px 10px;font:500 13.5px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;line-height:1.2}
.btn:disabled{opacity:.35;cursor:default}
.btn.big{padding:10px 14px;font-weight:600;font-size:15px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.armed{background:var(--warn);border-color:var(--warn);color:#1a1a1a}
.btn:focus-visible,.wd:focus-visible,.anim:focus-visible,.chip:focus-visible,.row:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.list{display:flex;flex-direction:column;gap:12px}
.empty{border:2px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;display:grid;grid-template-columns:minmax(116px,36%) 1fr;overflow:hidden;border-left:5px solid var(--cc)}
.card.done{opacity:.6}
.anim{appearance:none;border:none;border-right:1px solid var(--line);background:var(--soft);position:relative;display:flex;align-items:center;justify-content:center;min-height:150px;padding:0;cursor:pointer;color:inherit}
.anim canvas{width:100%;aspect-ratio:1/1;max-width:100%;display:block}
.anim .no{position:absolute;top:6px;left:8px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.anim .b3{position:absolute;right:6px;bottom:6px;font:700 11px var(--mono);background:var(--ink);color:var(--surface);padding:2px 6px;border-radius:5px}
.info{padding:11px 12px;display:flex;flex-direction:column;gap:7px;min-width:0}
.info h3{margin:0;font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.alt{color:var(--muted);font-size:12px;margin-top:-4px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1.5px solid var(--cc,var(--line));line-height:1.35;background:transparent;color:var(--ink);font-family:var(--body)}
.chip.p{background:var(--cc);color:var(--ci,#fff)}
button.chip{cursor:pointer;font-size:13px;padding:5px 11px}
button.chip[aria-pressed="true"]{background:var(--cc,var(--ink));color:var(--ci,var(--surface));border-color:var(--cc,var(--ink))}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.step button{appearance:none;border:none;background:var(--soft);color:var(--ink);width:28px;height:28px;font:700 15px var(--mono);cursor:pointer}
.step span{font:700 13px var(--mono);padding:0 7px;font-variant-numeric:tabular-nums;white-space:nowrap}
.reps{font:700 13px var(--mono)}
.tools{display:flex;gap:4px;margin-left:auto}
.tools .btn{padding:4px 8px}
ul.tips{margin:0;padding-left:17px;font-size:13px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.btn.yt{background:#E62117;border-color:#E62117;color:#fff;font-weight:600}
.btn.chk[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[aria-pressed="true"].seg{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.mapgrid{display:grid;grid-template-columns:minmax(150px,44%) 1fr;gap:14px;margin-top:10px;align-items:start}
.mapgrid svg{width:100%;height:auto;display:block}
.mlist{display:flex;flex-direction:column;gap:4px;font-size:13px}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:3px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:none}
.mrow .n{font-weight:600}
.mrow .v{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.mrow .bar{grid-column:1/-1;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
.mrow .bar i{display:block;height:100%;background:var(--brand)}
.lvl{font-size:10.5px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:600}
.lvl.lo{background:var(--soft);color:var(--muted);border:1px solid var(--line)}
.lvl.ok{background:var(--ok);color:#fff}
.lvl.hi{background:var(--warn);color:#1a1a1a}
.tpls{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.tpl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.tpl:last-child{border-bottom:none}
.tpl b{display:block}
.tpl small{color:var(--muted)}
.notes ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.notes b{font-weight:600}
.warn{color:var(--muted);font-size:12.5px;margin:12px 0 0}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.shtop{display:flex;align-items:center;gap:10px;padding:10px 16px;position:sticky;top:0;background:var(--bg);z-index:3;border-bottom:1px solid var(--line)}
.shtop h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;line-height:1.05;flex:1;min-width:0}
.shbody{padding:12px 16px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.search{width:100%;font:500 16px var(--body);padding:11px 13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);color:var(--ink)}
.search:focus{outline:2px solid var(--brand);outline-offset:1px}
.scroller{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.scroller button{flex:none}
.flabel{font:700 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.count{font:600 13px var(--mono);color:var(--muted)}
.rows{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:6px 1fr auto;align-items:center;gap:10px;padding:9px 10px 9px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;color:inherit}
.row:last-child{border-bottom:none}
.row .cb{align-self:stretch;background:var(--cc)}
.row .t{font-weight:600;line-height:1.2}
.row .s{font-size:12px;color:var(--muted);line-height:1.3;margin-top:2px}
.add{appearance:none;border:1.5px solid var(--brand);background:transparent;color:var(--brand);width:38px;height:38px;border-radius:10px;font:700 20px var(--mono);cursor:pointer;flex:none}
.add.on{background:var(--ok);border-color:var(--ok);color:#fff;font-size:16px}
.more{align-self:center}
.vstage{position:relative;height:56vh;min-height:300px;max-height:600px;background:var(--soft);border-bottom:1px solid var(--line);touch-action:none;cursor:grab}
.vstage canvas{width:100%;height:100%;display:block}
.vstage .hintov{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:var(--muted);pointer-events:none}
.vctl{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
.vctl .grp{display:flex;gap:4px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.opt{display:flex;flex-direction:column;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;z-index:60;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:calc(100% - 32px);text-align:center}
.timer{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--surface);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;z-index:50;box-shadow:0 -6px 24px rgba(0,0,0,.18)}
.timer .t{font-family:var(--mono);font-weight:700;font-size:30px;font-variant-numeric:tabular-nums;min-width:4.2ch}
.timer .lbl{flex:1;font-size:13px;opacity:.8;min-width:0}
.timer .bar{position:absolute;left:0;top:0;height:4px;background:var(--brand);transition:width .25s linear}
.timer button{appearance:none;border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font:600 13px var(--body);cursor:pointer}
.timer.fin{background:var(--ok);color:#fff}
@media (max-width:430px){
  .card{grid-template-columns:112px 1fr}
  .info h3{font-size:18px}
  .mapgrid{grid-template-columns:1fr}
  .mapgrid svg{max-width:300px;margin:0 auto}
  .wd b{font-size:14px}
}
@media (prefers-reduced-motion:reduce){ .timer .bar{transition:none} }
</style>

<div class="wrap" id="app">
  <header class="top">
    <div><h1 id="h1"></h1><p class="sub" id="sub"></p></div>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="tr">TR</button><button type="button" data-lang="en">EN</button></div>
  </header>
  <div class="week" id="week"></div>
  <section id="day"></section>
  <section class="panel" id="mapPanel"></section>
  <section class="panel" id="tplPanel"></section>
  <section class="panel notes" id="notes"></section>
</div>

<div class="sheet" id="lib" hidden role="dialog" aria-modal="true" aria-labelledby="libTitle">
  <div class="shtop"><button class="btn" type="button" id="libClose"></button><h3 id="libTitle"></h3></div>
  <div class="shbody">
    <input class="search" id="q" type="search" autocomplete="off">
    <div><div class="flabel" id="lblCat"></div><div class="scroller" id="fcat"></div></div>
    <div><div class="flabel" id="lblEq"></div><div class="scroller" id="feq"></div></div>
    <div class="count" id="cnt"></div>
    <div class="rows" id="rows"></div>
    <button class="btn more" type="button" id="moreBtn" hidden></button>
  </div>
</div>

<div class="sheet" id="qb" hidden role="dialog" aria-modal="true" aria-labelledby="qbTitle">
  <div class="shtop"><button class="btn" type="button" id="qbClose"></button><h3 id="qbTitle"></h3></div>
  <div class="shbody">
    <p class="hint" id="qbHint"></p>
    <div class="opt"><div class="flabel" id="qbLblCat"></div><div class="chips" id="qbCat"></div></div>
    <div class="opt"><div class="flabel" id="qbLblN"></div><div class="chips" id="qbN"></div></div>
    <div class="opt"><div class="flabel" id="qbLblEq"></div><div class="chips" id="qbEq"></div></div>
    <button class="btn big pri" type="button" id="qbGo"></button>
  </div>
</div>

<div class="sheet" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="vtitle">
  <div class="shtop"><button class="btn" type="button" id="vclose"></button><h3 id="vtitle"></h3></div>
  <div class="vstage" id="vstage"><canvas id="vcanvas"></canvas><div class="hintov" id="vhint"></div></div>
  <div class="vctl">
    <div class="grp" id="vviews"></div>
    <div class="grp" id="vspeed"><button class="btn seg" type="button" data-sp="0.5">0,5×</button><button class="btn seg" type="button" data-sp="1" aria-pressed="true">1×</button></div>
    <button class="btn" type="button" id="vpause"></button>
  </div>
  <div class="shbody" id="vbody"></div>
</div>

<div class="toast" id="toast" hidden role="status"></div>
<div class="timer" id="timer" hidden>
  <div class="bar" id="tbar"></div>
  <div class="t" id="tnum">0:00</div>
  <div class="lbl" id="tlbl"></div>
  <button type="button" id="tplus"></button>
  <button type="button" id="tstop"></button>
</div>

const slug=s=>s.toLowerCase().replace(/’/g,'').replace(/°/g,'deg').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
BASES.forEach(b=>{
  const [p,s]=b.m.split('/');const mp=p.split(' ').filter(Boolean),ms=(s||'').split(' ').filter(Boolean);
  b.v.forEach(vs=>{
    let en,tr,eq,pat=b.pat,flags='';
    let str=vs;const at=str.indexOf('@');if(at>=0){pat=str.slice(at+1);str=str.slice(0,at)}
    const hs=str.indexOf('#');if(hs>=0){flags=str.slice(hs+1);str=str.slice(0,hs)}
    if(str[0]==='!'){const [a,c,d]=str.slice(1).split('|');en=a;tr=c;eq=d}
    else{
      const [eqs,ms2]=str.split(':');const hide=eqs.endsWith('!');eq=eqs.replace('!','');
      const mods=(ms2||'').split('+').filter(Boolean);
      const pre=mods.filter(x=>!POST.has(x)),post=mods.filter(x=>POST.has(x));
      const eqE=hide?'':EQN[eq][1],eqT=hide?'':EQN[eq][0];
      en=[...pre,eqE,...post,b.en].filter(Boolean).join(' ');
      tr=[...pre.map(x=>MODS[x]||x),eqT,...post.map(x=>MODS[x]||x),b.tr].filter(Boolean).join(' ');
    }
    const id=slug(en);if(EXID[id])return;
    const single=/Single-Arm/.test(en)||flags.includes('s');
    const kind=flags.includes('t')?'t':flags.includes('x')?'x':b.kind;
    if(!PAT[pat])console.warn('missing pattern',pat,en);
    const ex={id,en,tr,eq,cat:b.cat,pat,P:PAT[pat]||PAT.hold,mp,ms,kind,single,ttr:b.ttr,ten:b.ten};
    EX.push(ex);EXID[id]=ex;EXNAME[en]=ex;
  });
});
EX.forEach(e=>{
  const pts=[...Object.entries(e.P.A),...Object.entries(e.P.B)].filter(([k])=>!['G','EZ','WZ','KZ','AZ'].includes(k)).map(([,v])=>v);
  const xs=pts.map(q=>q[0]),ys=pts.map(q=>q[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(91,...ys);
  e.fr={cx:(x0+x1)/2,cy:(y0+y1)/2,s:Math.max(x1-x0,y1-y0,60)};
});

function act(a,u){
  const items=plan[day];const i=items.findIndex(x=>x.u===u);if(i<0)return;const it=items[i];
  if(a==='view'){openViewer(EXID[it.id],false);return}
  if(a==='rest'){startTimer(it.rest,exName(EXID[it.id]));return}
  if(a==='sm')it.sets=Math.max(1,it.sets-1);
  if(a==='sp')it.sets=Math.min(10,it.sets+1);
  if(a==='reps'){const j=REPS.indexOf(it.reps);it.reps=REPS[(j+1)%REPS.length]}
  if(a==='done')it.done=!it.done;
  if(a==='up'&&i>0){items.splice(i,1);items.splice(i-1,0,it)}
  if(a==='down'&&i<items.length-1){items.splice(i,1);items.splice(i+1,0,it)}
  if(a==='del')items.splice(i,1);
  save();renderWeek();renderDay();renderMap();
}

$('#qbGo').onclick=()=>{
  if(!qbCats.size){toast(T('qbPick'));return}
  const have=new Set(plan[day].map(it=>it.id));let added=0;
  [...qbCats].forEach(c=>{
    let pool=EX.filter(e=>e.cat===c&&qbEqs.has(eqGroup(e.eq))&&!have.has(e.id)&&e.kind!=='t');
    if(!pool.length)pool=EX.filter(e=>e.cat===c&&!have.has(e.id));
    const usedPat=new Set();const pick=[];
    const sh=pool.slice().sort(()=>Math.random()-.5);
    const order=[...sh.filter(e=>e.kind==='c'),...sh.filter(e=>e.kind!=='c')];
    for(const e of order){if(pick.length>=qbN)break;if(usedPat.has(e.pat))continue;usedPat.add(e.pat);pick.push(e)}
    for(const e of order){if(pick.length>=qbN)break;if(!pick.includes(e))pick.push(e)}
    pick.forEach(e=>{plan[day].push(mkItem(e));have.add(e.id);added++});
  });
  save();closeQB();renderWeek();renderDay();renderMap();toast(T('qbAdded')(added,T('days')[day]));

  const t=front?new THREE.Vector3(0,(91-e.fr.cy)/10,(e.fr.cx-50)/10):new THREE.Vector3((e.fr.cx-50)/10,(91-e.fr.cy)/10,0);
  G.floor.position.x=G.shadow.position.x=t.x;G.floor.position.z=G.shadow.position.z=t.z;
  G.dir.position.set(t.x+4,12,t.z+7);G.dir.target.position.set(t.x,0,t.z);
  return t;
}
function aimCam(cam,target,e,yawDeg,pitchDeg,zoom){
  const d=Math.max(12,e.fr.s/10*2.25)*(zoom||1);const y=yawDeg*Math.PI/180,pch=pitchDeg*Math.PI/180;
  cam.position.set(target.x+d*Math.sin(y)*Math.cos(pch),target.y+d*Math.sin(pch),target.z+d*Math.cos(y)*Math.cos(pch));cam.lookAt(target);
}

/* =============================== THUMBNAILS =============================== */
let visible=new Set(),io;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
const itemByU=u=>plan[day].find(x=>x.u===u);
function setupCanvases(){
  if(io)io.disconnect();visible.clear();
  io=new IntersectionObserver(es=>es.forEach(en=>en.isIntersecting?visible.add(en.target):visible.delete(en.target)),{rootMargin:'80px'});
  document.querySelectorAll('canvas[data-u]').forEach(c=>{io.observe(c);drawThumb(c,.5,0)});
}
function drawThumb(cv,p,t){
  const it=itemByU(cv.dataset.u);if(!it)return;const e=EXID[it.id];const col=readColors(e.cat);
  const dpr=Math.min(window.devicePixelRatio||1,2),w=cv.clientWidth||120,px=Math.round(w*dpr);
  if(cv.width!==px){cv.width=px;cv.height=px}
  const ctx=cv.getContext('2d');
  if(!G){draw2D(ctx,e,p,col);return}
  const target=setScene(e,p,col);
  const baseYaw=e.P.view==='front'?58:36;
  aimCam(G.cam,target,e,baseYaw+Math.sin(t*0.00035)*14,13);G.cam.aspect=1;G.cam.updateProjectionMatrix();
  G.thumb.render(G.scene,G.cam);
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,px,px);ctx.drawImage(G.thumb.domElement,0,0,px,px);
}

/* =============================== VIEWER =============================== */
let vOpen=false,vEx=null,vYaw=38,vPitch=12,vZoom=1,vSpeed=1,vPaused=false,vClock=0,vLast=0;
const segSel=(sel,b)=>document.querySelectorAll(sel+' button').forEach(x=>x.setAttribute('aria-pressed',x===b));
function openViewer(e,fromLib){
  vEx=e;vOpen=true;vYaw=e.P.view==='front'?58:38;vPitch=12;vZoom=1;vPaused=false;vClock=0;
  $('#vtitle').textContent=exName(e);$('#vpause').textContent=T('pause');
  document.querySelectorAll('#vviews button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.yaw===vYaw));
  const tips=lang==='tr'?e.ttr:e.ten;const inDay=plan[day].some(it=>it.id===e.id);const k=KIND[e.kind];
  $('#vbody').innerHTML=`
    ${fromLib?`<button class="btn big pri" type="button" id="vadd">${inDay?T('addedAlready')+' · ':''}${T('addTo')(T('days')[day])}</button>`:''}
    <div class="meta"><span class="chip p" style="${catStyle(e.cat)}">${cName(e.cat)}</span><span class="reps">${k[0]} × ${fmtReps(k[1])}</span><span class="alt" style="margin:0">${esc(exAlt(e))}</span></div>
    <div class="mapgrid"><div>${bodySVG(m=>e.mp.includes(m)?[catVar(e.cat),1]:e.ms.includes(m)?[catVar(e.cat),.42]:['var(--mus)',1],exName(e))}</div><div class="mlist">
      <div class="legend"><span><i style="background:${catVar(e.cat)}"></i>${T('primary')}</span><span><i style="background:${catVar(e.cat)};opacity:.42"></i>${T('secondary')}</span></div>
      ${e.mp.map(m=>`<div class="mrow"><span class="n">${mName(m)}</span><span class="v">${T('main')}</span></div>`).join('')}
      ${e.ms.map(m=>`<div class="mrow"><span class="n" style="font-weight:500">${mName(m)}</span><span class="v">${T('helper')}</span></div>`).join('')}
    </div></div>
    <ul class="tips">${tips.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>
    <div class="links"><a class="btn yt" href="${yt(e.en+' proper form')}" target="_blank" rel="noopener">▶ Video (EN)</a><a class="btn yt" href="${yt(e.tr+' nasıl yapılır')}" target="_blank" rel="noopener">▶ Video (TR)</a></div>`;
  if(fromLib)$('#vadd').onclick=()=>{addToDay(e,day);toast(T('added')(exName(e),T('days')[day]));if(libOpen)renderLib();$('#vadd').textContent=T('addedAlready')+' · '+T('addTo')(T('days')[day])};
  $('#viewer').hidden=false;document.body.style.overflow='hidden';$('#viewer').scrollTop=0;
  if(G&&!G.viewer){try{const r=new THREE.WebGLRenderer({canvas:$('#vcanvas'),antialias:true,alpha:true});r.setClearColor(0,0);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;G.viewer=r;G.vcam=new THREE.PerspectiveCamera(35,1,.1,200)}catch(err){G.viewer=null}}
  $('#vclose').focus();
}
function closeViewer(){vOpen=false;$('#viewer').hidden=true;if($('#lib').hidden&&$('#qb').hidden)document.body.style.overflow=''}
$('#vclose').onclick=closeViewer;
document.addEventListener('keydown',ev=>{if(ev.key!=='Escape')return;if(vOpen)closeViewer();else if(!$('#qb').hidden)closeQB();else if(libOpen)closeLib()});
$('#vspeed').querySelectorAll('button').forEach(b=>b.onclick=()=>{vSpeed=+b.dataset.sp;segSel('#vspeed',b)});
$('#vpause').onclick=()=>{vPaused=!vPaused;$('#vpause').textContent=vPaused?T('play'):T('pause')};
(function drag(){
  const st=$('#vstage');let ptrs=new Map(),lastDist=0;
  st.addEventListener('pointerdown',ev=>{st.setPointerCapture(ev.pointerId);ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);document.querySelectorAll('#vviews button').forEach(x=>x.setAttribute('aria-pressed',false))});
  st.addEventListener('pointermove',ev=>{if(!ptrs.has(ev.pointerId))return;const [px,py]=ptrs.get(ev.pointerId);
    if(ptrs.size===1){vYaw-=(ev.clientX-px)*0.45;vPitch=Math.max(-5,Math.min(70,vPitch+(ev.clientY-py)*0.3))}
    ptrs.set(ev.pointerId,[ev.clientX,ev.clientY]);
    if(ptrs.size===2){const [a,b]=[...ptrs.values()];const dd=Math.hypot(a[0]-b[0],a[1]-b[1]);if(lastDist)vZoom=Math.max(.55,Math.min(1.8,vZoom*lastDist/dd));lastDist=dd}});
  const up=ev=>{ptrs.delete(ev.pointerId);if(ptrs.size<2)lastDist=0};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',ev=>{ev.preventDefault();vZoom=Math.max(.55,Math.min(1.8,vZoom*(1+ev.deltaY*0.001)))},{passive:false});
})();
function drawViewer(){
  const cv=$('#vcanvas'),e=vEx;const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;const col=readColors(e.cat);
  const p=reduce.matches&&!vPaused?Math.floor(vClock/1800)%2:(1-Math.cos(2*Math.PI*vClock/2800))/2;
  if(!G||!G.viewer){const dpr=Math.min(devicePixelRatio||1,2);const s=Math.min(w,h);if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    const ctx=cv.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);const off=document.createElement('canvas');off.width=off.height=Math.round(s*dpr);draw2D(off.getContext('2d'),e,p,col);ctx.drawImage(off,(cv.width-off.width)/2,(cv.height-off.height)/2);return}
  const r=G.viewer;const dpr=Math.min(devicePixelRatio||1,2);
  if(r.getPixelRatio()!==dpr)r.setPixelRatio(dpr);
  const sz=r.getSize(new THREE.Vector2());if(sz.x!==w||sz.y!==h)r.setSize(w,h,false);
  const target=setScene(e,p,col);G.vcam.aspect=w/h;G.vcam.updateProjectionMatrix();
  aimCam(G.vcam,target,e,vYaw,vPitch,vZoom*(w/h<1?1.45:1.1));r.render(G.scene,G.vcam);
}

/* =============================== LOOP =============================== */
let lastThumb=0;
function loop(now){
  const dt=vLast?Math.min(100,now-vLast):16;vLast=now;
  if(vOpen){if(!vPaused)vClock+=dt*vSpeed;drawViewer()}
  else if(!libOpen&&$('#qb').hidden&&visible.size&&now-lastThumb>30){lastThumb=now;
    const p=reduce.matches?Math.floor(now/1800)%2:(1-Math.cos(2*Math.PI*(now%2800)/2800))/2;
    visible.forEach(c=>drawThumb(c,p,reduce.matches?0:now));}
  requestAnimationFrame(loop);
}

/* =============================== TIMER =============================== */
let tEnd=0,tTotal=0,tInt=null,wake=null;
function startTimer(sec,name){
  tTotal=sec;tEnd=Date.now()+sec*1000;$('#tlbl').textContent=`${T('restLbl')} · ${name}`;
  const el=$('#timer');el.hidden=false;el.classList.remove('fin');
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}
}
function tick(){
  const left=Math.max(0,tEnd-Date.now()),s=Math.ceil(left/1000);
  $('#tnum').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  $('#tbar').style.width=(100*(1-left/(tTotal*1000)))+'%';
  if(left<=0){clearInterval(tInt);$('#timer').classList.add('fin');$('#tlbl').textContent=T('timeUp');try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}
$('#tplus').onclick=()=>{if($('#timer').classList.contains('fin')){startTimer(30,T('extra'));return}tEnd+=30000;tTotal+=30;tick()};
$('#tstop').onclick=()=>{clearInterval(tInt);$('#timer').hidden=true;try{wake&&wake.release()}catch(e){}};

/* =============================== BOOT =============================== */
document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('lang',lang);renderAll();if(libOpen){$('#libTitle').textContent=T('libFor')(T('days')[day]);renderLibFilters();renderLib()}});
init3D();
renderAll();requestAnimationFrame(loop);
</script>
<script>if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}</script>
</body></html>
